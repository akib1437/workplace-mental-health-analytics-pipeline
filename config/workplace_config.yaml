project:
  name: "Configurable disclosure-controlled workplace survey pipeline"
  report_boundary: "Aggregate-only reporting. No individual-level output is permitted."

dataset:
  name: "Bangladesh office-worker survey"
  path: "data/private/workplace_survey.xlsx"
  format: "xlsx"
  sheet_name: "Form Responses 1"
  expected_rows: 406
  id_column: null
  field_mapping: {}
  source_severity_columns:
    phq9: "phq9_severity"
    gad7: "gad7_severity"

validation:
  item_response_values: [0, 1, 2, 3]
  duplicate_rule: "full_row"
  require_complete_item_responses: true

scales:
  phq9:
    display_name: "PHQ-9"
    item_columns: [phq1, phq2, phq3, phq4, phq5, phq6, phq7, phq8, phq9]
    score_column: "phq9_total"
    severity_column: "phq9_severity_calculated"
    moderate_or_higher_column: "phq9_moderate_or_higher"
    thresholds:
      - {upper_inclusive: 4, label: "Minimal"}
      - {upper_inclusive: 9, label: "Mild"}
      - {upper_inclusive: 14, label: "Moderate"}
      - {upper_inclusive: 19, label: "Moderately Severe"}
      - {upper_inclusive: 27, label: "Severe"}
    moderate_or_higher_score: 10
    expected_alpha: 0.9192933860
    expected_moderate_or_higher_pct: 23.6453201970

  gad7:
    display_name: "GAD-7"
    item_columns: [gad1, gad2, gad3, gad4, gad5, gad6, gad7]
    score_column: "gad7_total"
    severity_column: "gad7_severity_calculated"
    moderate_or_higher_column: "gad7_moderate_or_higher"
    thresholds:
      - {upper_inclusive: 4, label: "Minimal"}
      - {upper_inclusive: 9, label: "Mild"}
      - {upper_inclusive: 14, label: "Moderate"}
      - {upper_inclusive: 21, label: "Severe"}
    moderate_or_higher_score: 10
    expected_alpha: 0.9230573096
    expected_moderate_or_higher_pct: 19.7044334975

analysis:
  subgroup_columns:
    - age_grp
    - gender
    - exp_yrs
    - salary_rng_bdt
    - marital
    - commute_oneway
    - stress_relief
    - org_mh_support
    - jobsec_growth_sat
    - sleep_hrs_wkday
  fdr_method: "fdr_bh"
  fdr_alpha: 0.05
  chi_square:
    min_expected_cell_count: 5
    max_fraction_expected_below_min: 0.20
  effect_size:
    illustrative_reporting_signal_threshold: 0.25
    note: "Operational reporting threshold only; not a clinical or universal management cut-off."

disclosure_control:
  minimum_cell_count: 5
  action: "suppress_small_cells"
  text_for_suppressed_cell: "Suppressed (<5)"
  disclose_row_level_data: false

outputs:
  directory: "outputs"
  include_source_severity_reconciliation: true
